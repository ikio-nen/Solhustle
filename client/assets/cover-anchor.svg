<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Code editor showing an Anchor escrow program with tests passing">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20232a"/>
      <stop offset="1" stop-color="#15171c"/>
    </linearGradient>
    <filter id="soft4" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg4)"/>
  <circle cx="1020" cy="140" r="150" fill="#d8f75a" opacity="0.10"/>

  <g filter="url(#soft4)">
    <rect x="100" y="90" width="1000" height="620" rx="20" fill="#1d2027" stroke="#2e323b"/>
  </g>
  <rect x="100" y="90" width="1000" height="52" rx="20" fill="#242832"/>
  <rect x="100" y="122" width="1000" height="20" fill="#242832"/>
  <circle cx="134" cy="116" r="7" fill="#e06666"/>
  <circle cx="158" cy="116" r="7" fill="#e8c85a"/>
  <circle cx="182" cy="116" r="7" fill="#8ce07a"/>
  <text x="220" y="122" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#8b909c">programs/escrow/src/lib.rs</text>

  <!-- gutter -->
  <rect x="100" y="142" width="62" height="568" fill="#191c22"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#5b6270" text-anchor="end">
    <text x="146" y="182">12</text><text x="146" y="212">13</text><text x="146" y="242">14</text>
    <text x="146" y="272">15</text><text x="146" y="302">16</text><text x="146" y="332">17</text>
    <text x="146" y="362">18</text><text x="146" y="392">19</text><text x="146" y="422">20</text>
    <text x="146" y="452">21</text><text x="146" y="482">22</text><text x="146" y="512">23</text>
    <text x="146" y="542">24</text><text x="146" y="572">25</text><text x="146" y="602">26</text>
  </g>

  <g font-family="ui-monospace, Menlo, monospace" font-size="16">
    <text x="182" y="182" fill="#c792ea">#[derive</text><text x="266" y="182" fill="#ecc48d">(Accounts)</text><text x="352" y="182" fill="#c792ea">]</text>
    <text x="182" y="212" fill="#d8f75a">pub struct</text><text x="290" y="212" fill="#f4f6ef">FundEscrow</text><text x="404" y="212" fill="#8b909c">&lt;'info&gt; {</text>
    <text x="206" y="242" fill="#8b909c">/// CHECK: vault PDA, never a user key</text>
    <text x="206" y="272" fill="#d8f75a">pub vault:</text><text x="326" y="272" fill="#f4f6ef">AccountInfo</text><text x="452" y="272" fill="#8b909c">&lt;'info&gt;,</text>
    <text x="206" y="302" fill="#d8f75a">pub client:</text><text x="334" y="302" fill="#f4f6ef">Signer</text><text x="404" y="302" fill="#8b909c">&lt;'info&gt;,</text>
    <text x="206" y="332" fill="#d8f75a">pub system_program:</text><text x="420" y="332" fill="#f4f6ef">Program</text><text x="500" y="332" fill="#8b909c">&lt;'info&gt;,</text>
    <text x="182" y="362" fill="#8b909c">}</text>
    <text x="182" y="412" fill="#d8f75a">pub fn</text><text x="254" y="412" fill="#82aaff">fund</text><text x="310" y="412" fill="#f4f6ef">(ctx: Context&lt;FundEscrow&gt;, amount: u64) -&gt; Result&lt;()&gt; {</text>
    <text x="206" y="442" fill="#c792ea">require!</text><text x="294" y="442" fill="#f4f6ef">(amount &gt;= RENT_FLOOR, EscrowError::Underfunded);</text>
    <text x="206" y="472" fill="#f4f6ef">let ix = system_instruction::transfer(</text>
    <text x="230" y="502" fill="#f4f6ef">&amp;ctx.accounts.client.key(), &amp;ctx.accounts.vault.key(), amount,</text>
    <text x="206" y="532" fill="#f4f6ef">);</text>
    <text x="206" y="562" fill="#8b909c">invoke(&amp;ix, &amp;ctx.accounts.system_program.to_account_infos())</text>
    <text x="182" y="592" fill="#8b909c">}</text>
  </g>

  <!-- test results panel -->
  <g>
    <rect x="700" y="470" width="370" height="200" rx="14" fill="#15181e" stroke="#2e323b"/>
    <text x="726" y="506" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#f4f6ef">anchor test</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="15">
      <text x="726" y="544" fill="#8ce07a">✓</text><text x="750" y="544" fill="#c8ccd4">funds the vault</text>
      <text x="726" y="576" fill="#8ce07a">✓</text><text x="750" y="576" fill="#c8ccd4">rejects underfunding</text>
      <text x="726" y="608" fill="#8ce07a">✓</text><text x="750" y="608" fill="#c8ccd4">releases on approval</text>
      <text x="726" y="640" fill="#8ce07a">✓</text><text x="750" y="640" fill="#c8ccd4">refunds on refund</text>
    </g>
    <rect x="948" y="522" width="98" height="30" rx="15" fill="#14351f"/>
    <text x="997" y="542" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#8ce07a">4 passing</text>
  </g>
</svg>
