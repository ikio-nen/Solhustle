<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Block explorer showing escrow deposit, release and refund transactions">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8f4"/>
      <stop offset="1" stop-color="#e9ede0"/>
    </linearGradient>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#23252c" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg2)"/>
  <circle cx="1040" cy="120" r="150" fill="#d8f75a" opacity="0.20"/>
  <circle cx="140" cy="700" r="120" fill="#23252c" opacity="0.06"/>

  <g filter="url(#soft2)">
    <rect x="90" y="110" width="1020" height="580" rx="24" fill="#ffffff" stroke="#dcdfd3"/>
  </g>

  <!-- window chrome -->
  <rect x="90" y="110" width="1020" height="62" rx="24" fill="#f6f7f2"/>
  <rect x="90" y="150" width="1020" height="22" fill="#f6f7f2"/>
  <circle cx="130" cy="141" r="8" fill="#e06666"/>
  <circle cx="156" cy="141" r="8" fill="#e8c85a"/>
  <circle cx="182" cy="141" r="8" fill="#8ce07a"/>
  <rect x="230" y="128" width="420" height="26" rx="13" fill="#ffffff" stroke="#dcdfd3"/>
  <text x="248" y="147" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#6b7280">solscan.io/account/5wGYWDt87tHx…?cluster=devnet</text>

  <!-- heading row -->
  <text x="126" y="228" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#23252c">Escrow vault</text>
  <rect x="126" y="246" width="150" height="30" rx="15" fill="#e9f6ef"/>
  <text x="146" y="266" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650" fill="#0b7a45">devnet · active</text>

  <!-- balance tiles -->
  <g>
    <rect x="126" y="300" width="300" height="104" rx="16" fill="#f8f9f4" stroke="#e2e5d8"/>
    <text x="150" y="336" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#6b7280">Locked balance</text>
    <text x="150" y="378" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#23252c">0.2058 SOL</text>
  </g>
  <g>
    <rect x="450" y="300" width="300" height="104" rx="16" fill="#f8f9f4" stroke="#e2e5d8"/>
    <text x="474" y="336" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#6b7280">Rent reserve</text>
    <text x="474" y="378" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#23252c">890,880</text>
  </g>
  <g>
    <rect x="774" y="300" width="300" height="104" rx="16" fill="#f8f9f4" stroke="#e2e5d8"/>
    <text x="798" y="336" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#6b7280">Rounds</text>
    <text x="798" y="378" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#23252c">1</text>
  </g>

  <!-- transactions -->
  <text x="126" y="456" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650" fill="#23252c">Instruction history</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="15">
    <line x1="126" y1="482" x2="1074" y2="482" stroke="#e6e8df"/>
    <text x="126" y="516" fill="#6b7280">Signature</text>
    <text x="640" y="516" fill="#6b7280">Instruction</text>
    <text x="900" y="516" fill="#6b7280">Amount</text>
    <line x1="126" y1="534" x2="1074" y2="534" stroke="#e6e8df"/>
    <text x="126" y="570" fill="#23252c">4kQ9…7fA2</text>
    <rect x="632" y="552" width="112" height="26" rx="13" fill="#e9f6ef"/>
    <text x="652" y="571" fill="#0b7a45" font-size="14">deposit</text>
    <text x="900" y="570" fill="#23252c">0.2058 SOL</text>
    <line x1="126" y1="590" x2="1074" y2="590" stroke="#e6e8df"/>
    <text x="126" y="626" fill="#23252c">7mB3…1cD8</text>
    <rect x="632" y="608" width="112" height="26" rx="13" fill="#fdf5e4"/>
    <text x="652" y="627" fill="#8a6116" font-size="14">release</text>
    <text x="900" y="626" fill="#23252c">0.2058 SOL</text>
    <line x1="126" y1="646" x2="1074" y2="646" stroke="#e6e8df"/>
  </g>
</svg>
