<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="Solhustle dashboard showing contracts, escrow balance and a delivery awaiting approval">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8f2"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="38" flood-color="#23252c" flood-opacity="0.18"/>
    </filter>
    <clipPath id="win"><rect x="40" y="40" width="1320" height="820" rx="22"/></clipPath>
  </defs>

  <g filter="url(#sh)">
    <rect x="40" y="40" width="1320" height="820" rx="22" fill="url(#page)" stroke="#e3e6d9"/>
  </g>
  <g clip-path="url(#win)">
    <!-- top bar -->
    <rect x="40" y="40" width="1320" height="76" fill="#ffffff"/>
    <line x1="40" y1="116" x2="1360" y2="116" stroke="#eceee4"/>
    <rect x="76" y="66" width="30" height="30" rx="8" fill="#23252c"/>
    <rect x="84" y="74" width="14" height="5" rx="2" fill="#d8f75a"/>
    <rect x="84" y="82" width="14" height="12" rx="2" fill="#d8f75a" opacity="0.55"/>
    <text x="120" y="87" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#23252c">Solhustle</text>
    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#6b7280">
      <text x="300" y="87">Dashboard</text>
      <text x="404" y="87">My jobs</text>
      <text x="490" y="87">Find freelancers</text>
      <text x="636" y="87">Post a job</text>
    </g>
    <rect x="296" y="98" width="86" height="4" rx="2" fill="#23252c"/>
    <rect x="1200" y="62" width="128" height="38" rx="19" fill="#f4f6ee" stroke="#e3e6d9"/>
    <circle cx="1222" cy="81" r="13" fill="#23252c"/>
    <text x="1222" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#d8f75a">BU</text>
    <text x="1244" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#23252c">buyer</text>

    <!-- page heading -->
    <text x="80" y="176" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" fill="#23252c">Welcome back, buyer</text>
    <text x="80" y="204" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#6b7280">You're using Solhustle as a client.</text>

    <!-- stat row -->
    <g>
      <rect x="80" y="236" width="290" height="112" rx="16" fill="#ffffff" stroke="#e6e9dd"/>
      <text x="104" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#6b7280">Open contracts</text>
      <text x="104" y="316" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700" fill="#23252c">2</text>
      <text x="132" y="316" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#6b7280">waiting</text>
    </g>
    <g>
      <rect x="390" y="236" width="290" height="112" rx="16" fill="#ffffff" stroke="#e6e9dd"/>
      <text x="414" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#6b7280">In escrow</text>
      <text x="414" y="316" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700" fill="#23252c">0.62 SOL</text>
    </g>
    <g>
      <rect x="700" y="236" width="290" height="112" rx="16" fill="#ffffff" stroke="#e6e9dd"/>
      <text x="724" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#6b7280">Released</text>
      <text x="724" y="316" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700" fill="#23252c">6</text>
    </g>
    <g>
      <rect x="1010" y="236" width="272" height="112" rx="16" fill="#fbfdf3" stroke="#dbe6bc"/>
      <text x="1034" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#5d6b26">Profile score</text>
      <text x="1034" y="316" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700" fill="#23252c">100%</text>
      <rect x="1034" y="330" width="220" height="7" rx="3.5" fill="#e6eccf"/>
      <rect x="1034" y="330" width="220" height="7" rx="3.5" fill="#8a9a3c"/>
    </g>

    <!-- section head -->
    <text x="80" y="404" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650" fill="#23252c">Hiring</text>
    <rect x="1196" y="378" width="86" height="36" rx="18" fill="#23252c"/>
    <text x="1239" y="402" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650" fill="#ffffff">Post</text>

    <!-- job cards -->
    <g>
      <rect x="80" y="434" width="590" height="180" rx="18" fill="#ffffff" stroke="#e6e9dd"/>
      <rect x="104" y="458" width="76" height="26" rx="13" fill="#f4f6ee"/>
      <text x="120" y="477" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#6b7280">Hiring</text>
      <rect x="540" y="458" width="106" height="26" rx="13" fill="#e9f6ef"/>
      <text x="560" y="477" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b7a45">delivered</text>
      <text x="104" y="524" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650" fill="#23252c">Solana Web3 Landing Page</text>
      <rect x="104" y="542" width="470" height="11" rx="5" fill="#dfe3d5"/>
      <rect x="104" y="562" width="380" height="11" rx="5" fill="#dfe3d5"/>
      <line x1="104" y1="586" x2="646" y2="586" stroke="#eceee4"/>
      <text x="104" y="608" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#23252c">$25</text>
      <text x="146" y="608" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#6b7280">≈ 0.2058 SOL</text>
      <rect x="520" y="588" width="126" height="36" rx="18" fill="#0b7a45"/>
      <text x="583" y="612" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650" fill="#ffffff">Approve</text>
    </g>
    <g>
      <rect x="690" y="434" width="592" height="180" rx="18" fill="#ffffff" stroke="#e6e9dd"/>
      <rect x="714" y="458" width="76" height="26" rx="13" fill="#f4f6ee"/>
      <text x="730" y="477" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#6b7280">Hiring</text>
      <rect x="1150" y="458" width="108" height="26" rx="13" fill="#fdf5e4"/>
      <text x="1170" y="477" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#8a6116">in progress</text>
      <text x="714" y="524" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650" fill="#23252c">Anchor Escrow Audit</text>
      <rect x="714" y="542" width="480" height="11" rx="5" fill="#dfe3d5"/>
      <rect x="714" y="562" width="330" height="11" rx="5" fill="#dfe3d5"/>
      <line x1="714" y1="586" x2="1258" y2="586" stroke="#eceee4"/>
      <text x="714" y="608" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#23252c">$120</text>
      <text x="768" y="608" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#6b7280">≈ 0.9985 SOL</text>
    </g>

    <!-- delivery panel with image thumbnails -->
    <g>
      <rect x="80" y="638" width="1202" height="196" rx="18" fill="#fbfcf7" stroke="#e0e5d0"/>
      <text x="104" y="676" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650" fill="#23252c">Deliverable ready for review</text>
      <rect x="104" y="694" width="150" height="112" rx="12" fill="#e9ede0"/>
      <path d="M140 770 l24 -30 18 22 14 -16 22 24 z" fill="#b9c19f"/>
      <circle cx="146" cy="722" r="9" fill="#d8f75a"/>
      <rect x="266" y="694" width="150" height="112" rx="12" fill="#1d2027"/>
      <rect x="284" y="716" width="80" height="8" rx="4" fill="#d8f75a" opacity="0.8"/>
      <rect x="284" y="734" width="114" height="8" rx="4" fill="#5b6270"/>
      <rect x="284" y="752" width="96" height="8" rx="4" fill="#5b6270"/>
      <rect x="284" y="770" width="66" height="8" rx="4" fill="#5b6270"/>
      <rect x="428" y="694" width="196" height="112" rx="12" fill="#e9ede0"/>
      <circle cx="526" cy="750" r="30" fill="#ffffff"/>
      <path d="M518 736 l26 14 -26 14 z" fill="#23252c"/>
      <rect x="644" y="694" width="200" height="112" rx="12" fill="#ffffff" stroke="#e2e6d6"/>
      <text x="666" y="726" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#6b7280">github.com/…</text>
      <rect x="666" y="740" width="130" height="10" rx="5" fill="#dfe3d5"/>
      <rect x="666" y="760" width="90" height="10" rx="5" fill="#dfe3d5"/>
      <rect x="864" y="694" width="418" height="112" rx="12" fill="#ffffff" stroke="#e2e6d6"/>
      <text x="888" y="726" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#6b7280">Notes</text>
      <rect x="888" y="742" width="360" height="11" rx="5" fill="#dfe3d5"/>
      <rect x="888" y="764" width="280" height="11" rx="5" fill="#dfe3d5"/>
    </g>
  </g>
</svg>
